name: memory live smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memory-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --bins --locked
          cargo build --package xtask --locked
      - name: file editing, Bash, memory, latency and tool budget
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: cargo xtask memory-smoke --live --binary target/release/rusty --report memory-live.json
      - name: summary
        if: always()
        run: cargo xtask memory-summary memory-live.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-live-receipt
          path: memory-live.json
          if-no-files-found: warn
