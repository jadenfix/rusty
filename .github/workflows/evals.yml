name: evals
# Live model evals cost tokens, so they only run when asked.
on:
  workflow_dispatch:
    inputs:
      models:
        description: space-separated model ids (each needs its provider's key as a secret)
        default: nvidia/nemotron-3-super-120b-a12b
      repeats:
        description: runs of each task per model
        default: "1"
      tasks:
        description: "comma-separated task names, or multi (empty: all)"
        default: ""
      jobs:
        description: tasks run at once (fewer is gentler on a rate-limited key)
        default: "4"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep expect
      - name: evals
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_MODELS: ${{ inputs.models }}
          EVAL_REPEATS: ${{ inputs.repeats }}
          EVAL_TASKS: ${{ inputs.tasks }}
          EVAL_JOBS: ${{ inputs.jobs }}
        run: scripts/eval.sh "$EVAL_TASKS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            target/evals/*.jsonl
            target/evals/*.md
            target/evals/*/
