name: evals
# Live model evals cost tokens, so they only run when asked.
on:
  workflow_dispatch:
    inputs:
      evals:
        description: run the evals (turn off to only record a demo)
        type: boolean
        default: true
      models:
        description: space-separated model ids (each needs its provider's key as a secret)
        default: nvidia/nemotron-3-super-120b-a12b
      repeats:
        description: runs of each task per model
        default: "1"
      tasks:
        description: "comma-separated task names, or multi (empty: all)"
        default: ""
      jobs:
        description: tasks run at once (fewer is gentler on a rate-limited key)
        default: "4"
      demo:
        description: "also record this scripts/record.py scene against demo/shop (e.g. providers); empty: none"
        default: ""

permissions:
  contents: read

jobs:
  evals:
    if: inputs.evals
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep expect
      - name: evals
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_MODELS: ${{ inputs.models }}
          EVAL_REPEATS: ${{ inputs.repeats }}
          EVAL_TASKS: ${{ inputs.tasks }}
          EVAL_JOBS: ${{ inputs.jobs }}
        run: scripts/eval.sh "$EVAL_TASKS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            target/evals/*.jsonl
            target/evals/*.md
            target/evals/*/

  # A real session for the README, recorded with the repository's keys.
  demo:
    if: inputs.demo != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: cargo build --release && cargo install --locked --git https://github.com/asciinema/agg --rev aae34b01
      - name: record
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCENE: ${{ inputs.demo }}
        run: |
          mkdir -p out
          work=$(mktemp -d) && cp -R demo/shop/. "$work"
          (cd "$work" && RUSTY_BIN="$GITHUB_WORKSPACE/target/release/rusty" RUSTY_HOME="$(mktemp -d)" \
            python3 "$GITHUB_WORKSPACE/scripts/record.py" "$SCENE" "$GITHUB_WORKSPACE/out/$SCENE.cast" -- --yolo)
          agg --theme monokai "out/$SCENE.cast" "out/$SCENE.gif"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo
          path: out/
