name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Standard 2-vCPU hosted runners: the smallest GitHub offers.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: memory hooks, real CLI and offline provider
        run: |
          cargo build --bins --locked
          python3 scripts/memory_smoke.py --report memory-offline.json
      - name: memory quality and conservative Auto routing, offline
        run: |
          python3 scripts/behavior_check.py --report memory-quality.json
          python3 scripts/mode_smoke.py --report mode-quality.json
      - name: local full-stack execution, offline provider
        run: python3 scripts/fullstack_smoke.py --report fullstack-quality.json
      - name: steady footer, approval and interruption in real PTYs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y expect
          python3 tests/tty/capture.py --binary target/debug/rusty --output target/tty-quality
          python3 tests/tty/inspect.py target/tty-quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-quality-receipts
          path: |
            memory-quality.json
            mode-quality.json
            fullstack-quality.json
            target/tty-quality/alignment.json
      - name: cloud launcher, offline
        run: python3 -m unittest cloud/test_daytona.py
      - name: hybrid tools and parallel swarms, offline SDK and model
        run: python3 -m unittest cloud/test_hybrid.py

  messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$TITLE" | scripts/check-message.sh -
      - name: PR description has no tool attribution
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE 'generated (with|by) |co-authored-by: *(claude|copilot|chatgpt|gpt|gemini|cursor|codex)|\bclaude code\b|as an ai\b|🤖'; then
            echo "Write the description as yourself; remove tool attribution." && exit 1
          fi
      - name: every commit follows Conventional Commits
        run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" | scripts/check-message.sh - || { echo "in commit $sha"; exit 1; }
          done
