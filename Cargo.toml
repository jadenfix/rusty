[package]
name = "rusty"
default-run = "rusty"
version = "0.1.0"
edition = "2021"
description = "A tiny terminal coding agent powered by open models on NVIDIA's API"
license = "MIT"

[dependencies]
anyhow = "1"
ctrlc = "3"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustyline = "14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }

[profile.release]
lto = true
strip = true
